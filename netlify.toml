[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://salderingscheck-nl.goatcounter.com https://images.daisycon.io https://static.daisycon.tools https://*.daisycon.io; style-src 'self' 'unsafe-inline'; script-src 'self' https://gc.zgo.at https://daisycon.tools; connect-src 'self' https://salderingscheck-nl.goatcounter.com https://daisycon.tools https://*.daisycon.io; manifest-src 'self'; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/terugleverkosten-2027/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/thuisbatterij-terugverdientijd/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/einde-salderen-wat-nu/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/over/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
